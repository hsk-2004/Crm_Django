{% extends "layouts/base.html" %}
{% load static %}

{% block title %}Delete Client{% endblock %}

{% block content %}
<div class="py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card text-center" style="background:#111827;border:1px solid #451a1a;border-radius:14px;">
                <div class="card-body p-5">
                    <div style="font-size:3rem;margin-bottom:1rem;">🗑️</div>
                    <h5 class="text-white mb-2">Delete Client</h5>
                    <p class="text-white-50 mb-4">
                        Are you sure you want to delete <strong class="text-white">{{ client.name }}</strong>?
                        <br><span class="small text-danger">This action cannot be undone.</span>
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-3 justify-content-center">
                            <button type="submit" class="btn px-4 py-2"
                                style="background:#7f1d1d;color:#fca5a5;border-radius:8px;font-weight:600;">
                                Yes, Delete
                            </button>
                            <a href="{% url 'client_list' %}" class="btn px-4 py-2"
                                style="background:#1f2937;color:#9ca3af;border-radius:8px;">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
